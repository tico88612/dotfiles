[".oh-my-zsh"]
type = "git-repo"
url = "https://github.com/ohmyzsh/ohmyzsh.git"
refreshPeriod = "0" # Updates are controlled explicitly with `omz update`.

[".oh-my-zsh".clone]
args = ["--depth=1"]

[".oh-my-zsh".pull]
args = ["--ff-only"]

[".zsh-custom/plugins/zsh-autosuggestions"]
type = "archive"
url = "https://github.com/zsh-users/zsh-autosuggestions/archive/a411ef3e0992d4839f0732ebeb9823024afaaaa8.tar.gz"
stripComponents = 1
exact = true

[".zsh-custom/plugins/zsh-completions"]
type = "archive"
url = "https://github.com/zsh-users/zsh-completions/archive/5328eb7c01270417ad6d0ce75682dea00dfa18f2.tar.gz"
stripComponents = 1
exact = true

[".zsh-custom/plugins/zsh-nvm"]
type = "archive"
url = "https://github.com/lukechilds/zsh-nvm/archive/745291dcf20686ec421935f1c3f8f3a2918dd106.tar.gz"
stripComponents = 1
exact = true

[".zsh-custom/plugins/zsh-syntax-highlighting"]
type = "archive"
url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/1386f1213eb0b0589d73cd3cf7c56e6a972a9bfd.tar.gz"
stripComponents = 1
exact = true

[".zsh-custom/themes/powerlevel10k"]
