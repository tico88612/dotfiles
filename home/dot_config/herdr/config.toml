# Migrated from ~/.tmux.conf and ~/.tmux.conf.local for Herdr 0.8.2.
# Herdr has one prefix key, so this keeps tmux's primary Ctrl-b prefix.
# Change this to "ctrl+a" if you normally used tmux's secondary prefix.
onboarding = false

[theme]
name = "tokyo-night"

# Increase sidebar contrast while keeping the Tokyo Night palette.
[terminal]
# Keep inline images and Mermaid previews available through compatible outer
# terminals such as iTerm2 and Ghostty.
kitty_graphics = true

# Herdr has one CWD policy for panes, tabs, and workspaces. "follow" preserves
# the tmux behavior that new panes retain the current path.
new_cwd = "follow"

[keys]
prefix = "ctrl+a"

# Session-like actions (Herdr workspaces are the closest tmux equivalent).
detach = "prefix+d"
reload_config = "prefix+r"
new_workspace = "prefix+ctrl+c"
workspace_picker = "prefix+ctrl+f"
switch_workspace = "prefix+shift+1..9"
previous_workspace = "prefix+shift+left"
next_workspace = "prefix+shift+right"

# Agent navigation mirrors workspace navigation while using Alt.
focus_agent = "prefix+alt+1..9"
previous_agent = "prefix+alt+up"
next_agent = "prefix+alt+down"

# Window-like actions (Herdr tabs are the closest tmux equivalent).
new_tab = "prefix+c"
rename_tab = "prefix+comma"
previous_tab = "prefix+ctrl+h"
next_tab = "prefix+ctrl+l"
switch_tab = "prefix+1..9"
close_tab = "prefix+ampersand"

# Pane actions.
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
last_pane = "prefix+tab"
cycle_pane_next = ""
cycle_pane_previous = ""
split_horizontal = "prefix+minus"
split_vertical = "prefix+shift+minus"
close_pane = "prefix+x"
zoom = "prefix+plus"

# Herdr 0.8.2 has no tmux-style keyboard copy mode. Opening scrollback in
# $EDITOR is the closest equivalent to the old prefix+Enter binding.
edit_scrollback = "prefix+enter"

# Match the tmux uppercase H/J/K/L resize bindings. Herdr resizes one step per
# command rather than tmux's configured two-cell step.
resize_mode = ""
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"

[[keys.command]]
key = "prefix+shift+r"
type = "plugin_action"
command = "herdr-agent-quota.refresh"
description = "refresh all agent quotas"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "hproj.open"
description = "open a project workspace"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-theme-picker.open"
description = "pick a color theme"

[ui]
# Match tmux's bottom status bar and compact pane separators.
pane_borders = true
pane_outer_borders = false
pane_scrollbars = false
pane_gaps = false

# The tmux config starts with mouse mode disabled and does not copy selections
# directly to the OS clipboard.
mouse_capture = true
copy_on_select = true

# tmux creates windows without prompting for a name.
prompt_new_tab_name = false

# Ask for a name instead of deriving new workspace labels from their CWD (for
# example, showing the home directory as "~").
prompt_new_workspace_name = true

# Approximate the tmux status: network, uptime, battery, zoom, user, and host.
# Command entries are evaluated by the Herdr server.
tab_bar_right = [
  { type = "command", command = "ping -c 1 -W 1000 1.1.1.1 >/dev/null 2>&1 && printf '✔ Online' || printf '✘ Offline'", interval_seconds = 30, timeout_seconds = 2 },
  { type = "command", command = "uptime | awk '{ if (match($0, / up /)) { value = substr($0, RSTART + 4); sub(/, [0-9]+ users?.*$/, \"\", value); print \"↑ \" value } }'", interval_seconds = 60, timeout_seconds = 2 },
  { type = "command", command = "pmset -g batt | awk '{ all = all \" \" $0 } END { icon = (all ~ /AC Power|charging|charged/) ? \"🔌\" : \"🔋\"; match(all, /[0-9]+%/); if (RSTART) print icon \" \" substr(all, RSTART, RLENGTH) }'", interval_seconds = 60, timeout_seconds = 2 },
  { type = "zoom" },
  { type = "command", command = "id -un", interval_seconds = 3600, timeout_seconds = 2 },
  { type = "hostname" },
]
tab_bar_right_separator = "  "
window_title = "{hostname} ❐ {workspace} ● {tab} {terminal_title}"

agent_panel_sort = "priority"
agent_panel_scope = "current"

[ui.sidebar]

[ui.sidebar.spaces]
row_gap = 1

[ui.sidebar.agents]
row_gap = 1 # herdr-agent-quota
rows = [["state_icon", { token = "workspace", fg = "#89b4fa", bold = true, dim = false }, "tab", { token = "$quota_provider", bold = true, dim = false }, { token = "$quota_context", fg = "#9b8fd8", bold = true, dim = false }], [{ token = "$quota_topic", dim = false }], [{ token = "$quota_cache", fg = "#6fb5b7", bold = true, dim = false }, { token = "$quota_cache_ttl", fg = "#cdaa65", bold = true, dim = false }, { token = "$quota_error", fg = "#ca6470", bold = true, dim = false }], [{ token = "$quota_5h_normal", fg = "#84b084", bold = true, dim = false }, { token = "$quota_5h_warning", fg = "#cdaa65", bold = true, dim = false }, { token = "$quota_5h_danger", fg = "#ca6470", bold = true, dim = false }, { token = "$quota_week_normal", fg = "#84b084", bold = true, dim = false }, { token = "$quota_week_warning", fg = "#cdaa65", bold = true, dim = false }, { token = "$quota_week_danger", fg = "#ca6470", bold = true, dim = false }]]

[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", { token = "workspace", fg = "#89b4fa", bold = true, dim = false }, "tab", { token = "agent", fg = "#c47f6a", bold = true, dim = false }, { token = "$quota_context", fg = "#9b8fd8", bold = true, dim = false }], [{ token = "$quota_topic", dim = false }], [{ token = "$quota_cache", fg = "#6fb5b7", bold = true, dim = false }, { token = "$quota_cache_ttl", fg = "#cdaa65", bold = true, dim = false }, { token = "$quota_error", fg = "#ca6470", bold = true, dim = false }], [{ token = "$quota_5h_normal", fg = "#84b084", bold = true, dim = false }, { token = "$quota_5h_warning", fg = "#cdaa65", bold = true, dim = false }, { token = "$quota_5h_danger", fg = "#ca6470", bold = true, dim = false }, { token = "$quota_week_normal", fg = "#84b084", bold = true, dim = false }, { token = "$quota_week_warning", fg = "#cdaa65", bold = true, dim = false }, { token = "$quota_week_danger", fg = "#ca6470", bold = true, dim = false }]] # herdr-agent-quota-provider
codex = [["state_icon", { token = "workspace", fg = "#89b4fa", bold = true, dim = false }, "tab", { token = "agent", fg = "#7998b7", bold = true, dim = false }, { token = "$quota_context", fg = "#9b8fd8", bold = true, dim = false }], [{ token = "$quota_topic", dim = false }], [{ token = "$quota_cache", fg = "#6fb5b7", bold = true, dim = false }, { token = "$quota_cache_ttl", fg = "#cdaa65", bold = true, dim = false }, { token = "$quota_error", fg = "#ca6470", bold = true, dim = false }], [{ token = "$quota_5h_normal", fg = "#84b084", bold = true, dim = false }, { token = "$quota_5h_warning", fg = "#cdaa65", bold = true, dim = false }, { token = "$quota_5h_danger", fg = "#ca6470", bold = true, dim = false }, { token = "$quota_week_normal", fg = "#84b084", bold = true, dim = false }, { token = "$quota_week_warning", fg = "#cdaa65", bold = true, dim = false }, { token = "$quota_week_danger", fg = "#ca6470", bold = true, dim = false }]] # herdr-agent-quota-provider
grok = [["state_icon", { token = "workspace", fg = "#89b4fa", bold = true, dim = false }, "tab", { token = "agent", fg = "#acb4c3", bold = true, dim = false }, { token = "$quota_context", fg = "#9b8fd8", bold = true, dim = false }], [{ token = "$quota_topic", dim = false }], [{ token = "$quota_cache", fg = "#6fb5b7", bold = true, dim = false }, { token = "$quota_cache_ttl", fg = "#cdaa65", bold = true, dim = false }, { token = "$quota_error", fg = "#ca6470", bold = true, dim = false }], [{ token = "$quota_5h_normal", fg = "#84b084", bold = true, dim = false }, { token = "$quota_5h_warning", fg = "#cdaa65", bold = true, dim = false }, { token = "$quota_5h_danger", fg = "#ca6470", bold = true, dim = false }, { token = "$quota_week_normal", fg = "#84b084", bold = true, dim = false }, { token = "$quota_week_warning", fg = "#cdaa65", bold = true, dim = false }, { token = "$quota_week_danger", fg = "#ca6470", bold = true, dim = false }]] # herdr-agent-quota-provider
agy = [["state_icon", { token = "workspace", fg = "#89b4fa", bold = true, dim = false }, "tab", { token = "agent", fg = "#84b0af", bold = true, dim = false }, { token = "$quota_context", fg = "#9b8fd8", bold = true, dim = false }], [{ token = "$quota_topic", dim = false }], [{ token = "$quota_cache", fg = "#6fb5b7", bold = true, dim = false }, { token = "$quota_cache_ttl", fg = "#cdaa65", bold = true, dim = false }, { token = "$quota_error", fg = "#ca6470", bold = true, dim = false }], [{ token = "$quota_5h_normal", fg = "#84b084", bold = true, dim = false }, { token = "$quota_5h_warning", fg = "#cdaa65", bold = true, dim = false }, { token = "$quota_5h_danger", fg = "#ca6470", bold = true, dim = false }, { token = "$quota_week_normal", fg = "#84b084", bold = true, dim = false }, { token = "$quota_week_warning", fg = "#cdaa65", bold = true, dim = false }, { token = "$quota_week_danger", fg = "#ca6470", bold = true, dim = false }]] # herdr-agent-quota-provider
[advanced]
# tmux used a 5,000-line history; Herdr measures scrollback in bytes. Five MB
# is a practical approximation while allowing for long or wide terminal lines.
scrollback_limit_bytes = 5000000

